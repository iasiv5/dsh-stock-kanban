<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dsh-stock-kanban">
  <!-- dsh-stock-kanban 盯盘看板：三根渐升 K 柱既是 K 线也是看板分组列。
       配色顺序 蓝→青→蓝：A 股语境绿色偏利空，最高柱（最后一根）必须蓝色收尾，
       青柱放中间示意持仓分组；不设目标价刻线 -->
  <path d="M8.7 18.6V31" stroke="url(#b)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="6.4" y="22.6" width="4.6" height="5.6" rx="1.2" fill="url(#b)"/>
  <path d="M17.1 13.4V28.4" stroke="url(#t)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="14.8" y="17.8" width="4.6" height="7" rx="1.2" fill="url(#t)"/>
  <path d="M25.5 8.2V24.6" stroke="url(#b3)" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="23.2" y="12.4" width="4.6" height="9" rx="1.2" fill="url(#b3)"/>
  <defs>
    <linearGradient id="b" x1="6" y1="13" x2="19" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF"/>
      <stop offset="1" stop-color="#324DE2"/>
    </linearGradient>
    <linearGradient id="t" x1="14.8" y1="10" x2="19.4" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45E7A4"/>
      <stop offset="1" stop-color="#05909D"/>
    </linearGradient>
    <linearGradient id="b3" x1="23.2" y1="5" x2="27.8" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF"/>
      <stop offset="1" stop-color="#324DE2"/>
    </linearGradient>
  </defs>
</svg>
