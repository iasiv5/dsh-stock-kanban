  <rect x="23.2" y="12.4" width="4.6" height="9" rx="1.2" fill="url(#t)"/>
  <path d="M26.8 5.4H32.4" stroke="url(#t)" stroke-width="2.4" stroke-linecap="round"/>
  <defs>
    <linearGradient id="b" x1="6" y1="13" x2="19" y2="31" gradientUnits="userSpaceOnUse">
